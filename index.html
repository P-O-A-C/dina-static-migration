<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172f42">
  <title>POAC | تسجيل الدخول</title>
  <link rel="stylesheet" href="css/poac.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="brand-panel">
      <div class="poac-mark">P</div>
      <p class="brand-kicker">BUSINESS WORKSPACE</p>
      <h1>POAC</h1>
      <p class="brand-copy">منصة موحدة لإدارة خدمات ومشروعات POAC.</p>
      <div class="brand-lines"><i></i><i></i><i></i></div>
      <small>ONE PLATFORM · MULTIPLE BUSINESSES</small>
    </section>
    <section class="login-panel">
      <div class="login-heading">
        <span class="eyebrow">WELCOME BACK</span>
        <h2>تسجيل الدخول</h2>
        <p>ادخل بيانات الحساب للوصول إلى مساحة العمل.</p>
      </div>
      <form id="loginForm">
        <label for="username">اسم المستخدم</label>
        <input id="username" name="username" autocomplete="username" placeholder="Username" required>
        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
        <button type="submit" class="login-button">دخول إلى POAC <span>←</span></button>
        <p id="loginMessage" class="form-message" role="status">واجهة تجريبية — لم يتم ربط تسجيل الدخول بعد.</p>
      </form>
      <div class="login-footer"><span>POAC</span><span>SECURE BUSINESS ACCESS</span></div>
    </section>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
