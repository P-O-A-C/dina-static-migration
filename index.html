<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#183b50">
  <meta name="description" content="POAC — بوابة الدخول الموحدة">
  <title>POAC | تسجيل الدخول</title>
  <link rel="stylesheet" href="assets/poac-portal.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
  <script src="assets/config.js"></script>
</head>
<body data-page="public-login" data-login-project="poac-admin">
  <main class="portal-shell">
    <section class="portal-brand">
      <div class="brand-monogram">P</div>
      <span class="brand-kicker">BUSINESS WORKSPACE</span>
      <h1>POAC</h1>
      <p>منصة موحدة لإدارة المشروعات والخدمات.</p>
      <div class="brand-rule"><i></i><i></i><i></i></div>
      <small>ONE PLATFORM · MULTIPLE BUSINESSES</small>
    </section>
    <section class="portal-login">
      <div class="login-heading">
        <span class="eyebrow">WELCOME BACK</span>
        <h2>تسجيل الدخول</h2>
        <p>أدخل اسم المستخدم وكلمة المرور للوصول إلى مساحة العمل.</p>
      </div>
      <form id="unifiedLoginForm" novalidate>
        <label for="username">اسم المستخدم أو البريد الإلكتروني</label>
        <input id="username" name="username" autocomplete="username" placeholder="Username or email" required>
        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
        <button id="loginBtn" type="submit">دخول إلى POAC <span>←</span></button>
        <p id="msg" class="login-message" role="status" aria-live="polite" hidden></p>
      </form>
      <footer><strong>POAC</strong><span>SECURE BUSINESS ACCESS</span></footer>
    </section>
  </main>
  <script src="assets/app.js?v=20261118-dina-central-poac-login-v1"></script>
</body>
</html>
