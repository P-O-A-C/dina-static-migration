<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07509B">
  <title>GRAND DRY CLEAN | إدارة الأقسام</title>
  <link rel="stylesheet" href="css/management-home.css?v=20261119-grand-brand-v1">
</head>
<body class="management-home auth-pending">
  <div id="authGate" class="auth-gate" role="status" aria-live="polite">
    <div class="auth-gate-card">
      <span class="auth-gate-mark" aria-hidden="true">G</span>
      <strong>GRAND DRY CLEAN</strong>
      <p>جارٍ التحقق من صلاحيات حساب المغسلة…</p>
      <span class="auth-loader" aria-hidden="true"></span>
    </div>
  </div>

  <div class="language-pill" aria-label="لغة الصفحة">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9S9.5 5.5 12 3Z"/></svg>
    <span>العربية</span>
  </div>

  <main class="management-container">
    <header class="brand-header" aria-label="GRAND DRY CLEAN">
      <img class="brand-logo" src="assets/grand-dry-clean-logo.png" alt="GRAND DRY CLEAN">
    </header>

    <section class="profile-actions" aria-label="إعدادات الحساب">
      <div class="profile-avatar" id="gmAvatar" aria-label="الصورة الشخصية">
        <svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="35"/><path d="M40 24c0-5 3-8 8-8s8 4 8 8c0 4-2 6-6 9L17 51c-3 2-2 6 2 6h42c4 0 5-4 2-6L38 39"/><path d="M18 61c7 8 15 11 24 11"/></svg>
      </div>
      <input id="gmAvatarInput" type="file" accept="image/*" hidden>
      <div class="profile-buttons">
        <button id="gmAvatarBtn" class="photo-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l1.5-2h8L18 7h2a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span>إضافة / تغيير الصورة</span>
        </button>
        <button id="logoutBtn" class="logout-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg>
          <span>تسجيل الخروج</span>
        </button>
      </div>
    </section>
    <p id="gmPhotoMsg" class="photo-message" role="status" aria-live="polite"></p>

    <div class="gold-divider" aria-hidden="true"></div>
    <h1 class="sections-heading">إدارة الأقسام</h1>

    <nav class="sections-grid" aria-label="أقسام الإدارة">
      <a class="section-tile" href="gm.html?view=products">
        <span class="tile-green"></span><span class="tile-wave"></span>
        <svg class="tile-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M8 12h32M8 24h32M8 36h32"/></svg>
        <strong>القائمة</strong>
      </a>
      <a class="section-tile" href="gm.html?view=categories">
        <span class="tile-green"></span><span class="tile-wave"></span>
        <svg class="tile-icon" viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="7" width="9" height="9" rx="1"/><rect x="20" y="7" width="9" height="9" rx="1"/><rect x="33" y="7" width="9" height="9" rx="1"/><rect x="7" y="20" width="9" height="9" rx="1"/><rect x="20" y="20" width="9" height="9" rx="1"/><rect x="33" y="20" width="9" height="9" rx="1"/><rect x="7" y="33" width="9" height="9" rx="1"/><rect x="20" y="33" width="9" height="9" rx="1"/><rect x="33" y="33" width="9" height="9" rx="1"/></svg>
        <strong>التصنيفات</strong>
      </a>
      <a class="section-tile" href="gm.html?view=branches">
        <span class="tile-green"></span><span class="tile-wave"></span>
        <svg class="tile-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M39 20c0 11-15 24-15 24S9 31 9 20a15 15 0 1 1 30 0Z"/><circle cx="24" cy="20" r="5"/></svg>
        <strong>الفروع</strong>
      </a>
      <a class="section-tile" href="gm.html?view=popular">
        <span class="tile-green"></span><span class="tile-wave"></span>
        <svg class="tile-icon" viewBox="0 0 48 48" aria-hidden="true"><path d="M8 17 13 8h22l5 9-5 7-5-5-6 6-6-6-5 5Z"/><path d="m8 17 4 24h24l4-24M16 8l8 11L32 8"/></svg>
        <strong>الأكثر طلبًا</strong>
      </a>
    </nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
  <script src="../assets/config.js"></script>
  <script src="js/session-guard.js?v=20261119-grand-brand-v1"></script>
  <script src="js/management-home.js?v=20261119-grand-brand-v1"></script>
</body>
</html>
