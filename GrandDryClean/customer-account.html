<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2D1912">
<title>حساب العميل | GRAND DRY CLEAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/customer-account.css">
</head><body>
<header class="account-header"><a href="index.html" class="brand">GRAND <span>DRY CLEAN</span></a><a class="back" href="index.html">الرئيسية ←</a></header>
<main class="account-main">
<section class="account-hero"><div class="mark">✦</div><small>GRAND CUSTOMER</small><h1>حسابك في GRAND</h1><p>تابع طلباتك واحتفظ ببياناتك في مكان واحد.</p></section>
<section class="account-card" id="authCard">
<div class="switch"><button class="active" id="loginTab">تسجيل الدخول</button><button id="registerTab">حساب جديد</button></div>
<form id="authForm">
<div id="nameField" hidden><label for="customerFullName">الاسم بالكامل</label><input id="customerFullName" autocomplete="name" maxlength="80" placeholder="اسمك"></div>
<label for="phoneInput">رقم الموبايل</label><input id="phoneInput" type="tel" inputmode="tel" autocomplete="tel" placeholder="01xxxxxxxxx" required>
<label for="pinInput">رمز PIN (4 إلى 6 أرقام)</label><input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]{4,6}" minlength="4" maxlength="6" autocomplete="current-password" placeholder="••••" required>
<button class="primary" id="authSubmit">دخول إلى حسابي</button><p class="message" id="authMessage" role="status"></p>
</form><p class="notice">بيانات الحساب محفوظة على هذا الجهاز فقط. لا يوجد تحقق من ملكية رقم الهاتف حتى ربط نظام تحقق آمن.</p>
</section>
<section class="profile-card" id="profileCard" hidden>
<div class="profile-head"><div class="avatar">♧</div><div><small>أهلاً بك</small><h2 id="profileName"></h2><p id="profilePhone"></p></div><button id="logoutBtn" class="logout">خروج</button></div>
<div class="profile-actions"><button class="action active" data-panel="orders">طلباتي</button><button class="action" data-panel="profile">بياناتي</button></div>
<div id="ordersPanel"><h3>طلباتك</h3><div id="ordersList" class="orders-list"></div></div>
<div id="profilePanel" hidden><h3>تعديل البيانات</h3><form id="profileForm"><label>الاسم<input id="editName" required maxlength="80"></label><label>رقم الموبايل<input id="editPhone" required type="tel"></label><button class="primary">حفظ التعديلات</button><p class="message" id="profileMessage"></p></form></div>
</section>
</main><footer>GRAND DRY CLEAN <span>POWERED BY POAC</span></footer>
<script src="js/customer-account.js"></script></body></html>
